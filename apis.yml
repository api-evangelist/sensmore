aid: sensmore
name: Sensmore
description: >-
  Sensmore (sensmore GmbH) is a German industrial-automation and embodied-AI company
  that turns robotics research into field-proven systems for heavy machinery in raw
  material operations. Its platform connects machines, sites, and data across mining,
  aggregates/construction, and defense, spanning products including Site Intelligence
  (live site operations), Machine Assist (driver assistance and collision warning),
  Eye (visual monitoring), Live Mapping (real-time site mapping), and Loader Automation
  (autonomous vehicle systems), with claims of reducing downtime by up to 30% while
  improving safety and resource efficiency. Sensmore was surfaced as a portfolio company
  of Point Nine and added to the API Evangelist network. As of this enrichment pass the
  company publishes no public API, SDK, developer portal, or developer documentation;
  its web presence is a marketing and corporate site.
